apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: monitoring
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 87.19.0
  targetNamespace: monitoring
  valuesContent: |
    # k3s regroupe ces composants dans un seul process, on ne peut pas les scraper à part
    kubeControllerManager: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeProxy: {enabled: false}
    kubeEtcd: {enabled: false}

    # La supervision tourne de préférence sur worker-pl (Pologne), qui ne porte pas Nextcloud.
    # "preferred" : si worker-pl tombe, les pods repartent sur un autre nœud.
    prometheusOperator:
      affinity: &worker-pl
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [worker-pl]}

    kube-state-metrics:
      affinity: *worker-pl

    alertmanager:
      enabled: false   # pas encore d'alertes, on économise la RAM

    prometheus:
      prometheusSpec:
        retention: 7d
        affinity: *worker-pl

    grafana:
      affinity: *worker-pl
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts: [grafana.ynov-table3-k3s.duckdns.org]
        tls:
          - secretName: grafana-tls
            hosts: [grafana.ynov-table3-k3s.duckdns.org]
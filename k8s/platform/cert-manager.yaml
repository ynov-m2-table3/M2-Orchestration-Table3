# HelmChart : objet de k3s, son contrôleur fait le "helm install" à notre place
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: v1.21.3
  targetNamespace: cert-manager
  valuesContent: |
    crds:
      enabled: true

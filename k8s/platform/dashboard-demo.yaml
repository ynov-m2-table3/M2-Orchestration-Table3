# Tableau de bord de la démo : Grafana le charge tout seul grâce à l'étiquette grafana_dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-demo-nextcloud
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  demo-nextcloud.json: |
    {
      "title": "Démo Nextcloud",
      "uid": "demo-nextcloud",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Trafic reçu par chaque pod Nextcloud",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 16,
            "h": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"nextcloud\", pod=~\"nextcloud-.*\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Où tourne chaque pod",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_pod_info{namespace=\"nextcloud\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "pod",
                    "node"
                  ]
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "node"
                  }
                ]
              }
            }
          ]
        },
        {
          "type": "state-timeline",
          "title": "Nœuds prêts",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "NotReady",
                      "color": "red"
                    },
                    "1": {
                      "text": "Ready",
                      "color": "green"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "legend": {
              "showLegend": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_node_status_condition{condition=\"Ready\", status=\"true\"}",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pods Nextcloud par état",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "drawStyle": "line",
                "lineInterpolation": "stepAfter"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Running"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Pending"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"nextcloud\", pod=~\"nextcloud-.*\", phase=~\"Running|Pending\"})",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        }
      ],
      "tags": [
        "table3"
      ]
    }

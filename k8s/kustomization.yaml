# Appliqué par k8s/deploy.sh (qui crée d'abord les Secrets)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud

resources:
  - namespace.yaml      # namespace + comptes de service + RBAC
  - mariadb.yaml
  - redis.yaml
  - nextcloud.yaml      # config, volume, Deployment, Service, HPA, Ingress
  - networkpolicy.yaml

# config.env -> ConfigMap "nextcloud-domain"
# (changer le domaine : kubectl -n nextcloud rollout restart deploy/nextcloud ensuite)
configMapGenerator:
  - name: nextcloud-domain
    envs: [config.env]
    # nom fixe (sans suffixe de hash) : la sonde et le test de charge le lisent aussi
    options: {disableNameSuffixHash: true}

# Le domaine est écrit une seule fois (config.env) et recopié dans l'Ingress
replacements:
  - source:
      kind: ConfigMap
      name: nextcloud-domain
      fieldPath: data.NEXTCLOUD_DOMAIN
    targets:
      - select: {kind: Ingress, name: nextcloud}
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0

# Image du projet (construite par la CI depuis image/Dockerfile, poussée sur ghcr.io).
# newTag = version déployée par défaut. La CI déploie le tag exact du commit (sha-xxxxxxx).
images:
  - name: nextcloud-table3
    newName: ghcr.io/ynov-m2-table3/nextcloud-table3
    newTag: "1.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: nextcloud

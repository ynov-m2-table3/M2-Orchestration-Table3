# Émetteurs de certificats Let's Encrypt (validation HTTP-01 via Traefik).
# staging : pour tester (certificat non reconnu par les navigateurs, mais pas de limite d'essais)
# letsencrypt : production (5 échecs/heure max -> toujours valider en staging d'abord)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt-staging}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-staging-account}
    solvers:
      - http01: {ingress: {ingressClassName: traefik}}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-account}
    solvers:
      - http01: {ingress: {ingressClassName: traefik}}

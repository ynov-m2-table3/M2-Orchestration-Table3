# Prometheus collecte aussi les métriques de Traefik : requêtes, codes HTTP, latence.
# C'est ce que voient les utilisateurs (trafic, erreurs, latence).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: monitoring
  labels:
    release: monitoring        # Prometheus ne lit que les monitors portant ce label
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s

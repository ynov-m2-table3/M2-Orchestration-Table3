# Compose "proxy" (Caddy) -> Ingress, servi par Traefik (inclus dans k3s)
# Le host est rempli par kustomize depuis config.env (NEXTCLOUD_DOMAIN)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
spec:
  ingressClassName: traefik
  tls:
    - hosts: [PLACEHOLDER]
      secretName: nextcloud-tls       # créé par scripts/create-tls.sh (auto-signé, lab)
  rules:
    - host: PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port: {name: http}

# Affiche le nom du pod dans chaque réponse (en-tête X-Pod) : preuve de la répartition de charge
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-pod-header
  namespace: nextcloud
data:
  pod-header.conf: |
    Header always set X-Pod "${HOSTNAME}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
spec:
  storageClassName: longhorn
  # RWX : le même volume est monté par tous les pods Nextcloud, sur des nœuds différents
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  # pas de "replicas" ici : deploy.sh installe avec 1 pod, puis passe à 3
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      automountServiceAccountToken: false   # pas besoin de parler à l API Kubernetes
      # Norvège de préférence, Suède en secours (là où sont les copies Longhorn), jamais la Pologne
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [norwayeast, swedencentral]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [norwayeast]
      # un pod par nœud, jamais deux sur le même
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nextcloud
      # si le nœud ne répond plus, le pod part ailleurs au bout de 30 s (5 min par défaut)
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      # attend que MariaDB réponde avant de lancer Nextcloud (l'équivalent du depends_on du compose)
      initContainers:
        - name: wait-mariadb
          image: mariadb:11.4
          command: [sh, -c, "until mariadb-admin ping -h mariadb --skip-ssl-verify-server-cert --silent; do echo 'attente de mariadb'; sleep 3; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: nextcloud
          image: nextcloud:33-apache
          env:
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD_FILE
              value: /run/secrets/nextcloud/db-password
            - name: NEXTCLOUD_ADMIN_USER
              value: admin
            - name: NEXTCLOUD_ADMIN_PASSWORD_FILE
              value: /run/secrets/nextcloud/admin-password
            - name: REDIS_HOST
              value: redis
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.ynov-table3-k3s.duckdns.org
            # Traefik est un pod du cluster : réseau des pods de k3s
            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.ynov-table3-k3s.duckdns.org
          ports:
            - containerPort: 80
          # le Host est obligatoire, sinon Nextcloud refuse (domaine non autorisé)
          startupProbe:   # 1re install : copie sur le volume partagé : jusqu'à 30 min
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.ynov-table3-k3s.duckdns.org
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.ynov-table3-k3s.duckdns.org
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.ynov-table3-k3s.duckdns.org
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: secrets
              mountPath: /run/secrets/nextcloud
              readOnly: true
            - name: pod-header
              mountPath: /etc/apache2/conf-enabled/pod-header.conf
              subPath: pod-header.conf
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: secrets
          secret:
            secretName: nextcloud
        - name: pod-header
          configMap:
            name: apache-pod-header
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [nextcloud.ynov-table3-k3s.duckdns.org]
      secretName: nextcloud-tls
  rules:
    - host: nextcloud.ynov-table3-k3s.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  number: 80
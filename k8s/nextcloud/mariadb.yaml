# StatefulSet : nom de pod fixe (mariadb-0) et un volume qui lui est attaché
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: nextcloud
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      automountServiceAccountToken: false   # pas besoin de parler à l API Kubernetes
      # Norvège de préférence, Suède en secours (là où sont les copies Longhorn), jamais la Pologne
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [norwayeast, swedencentral]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [norwayeast]
      # si le nœud ne répond plus, le pod part ailleurs au bout de 30 s (5 min par défaut)
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: mariadb
          image: mariadb:11.4
          args: [--transaction-isolation=READ-COMMITTED]
          env:
            - name: MARIADB_DATABASE
              value: nextcloud
            - name: MARIADB_USER
              value: nextcloud
            - name: MARIADB_PASSWORD_FILE
              value: /run/secrets/nextcloud/db-password
            - name: MARIADB_ROOT_PASSWORD_FILE
              value: /run/secrets/nextcloud/db-root-password
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: secrets
              mountPath: /run/secrets/nextcloud
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: nextcloud
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: nextcloud
spec:
  clusterIP: None
  selector:
    app: mariadb
  ports:
    - port: 3306

# Par défaut, plus rien n'entre dans le namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: nextcloud
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Traefik (kube-system) peut joindre les pods : Nextcloud
# et les pods temporaires de cert-manager pour le défi Let's Encrypt
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-traefik
  namespace: nextcloud
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# seul Nextcloud parle à MariaDB et Redis (l'équivalent du réseau "backend" du compose)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: nextcloud
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [mariadb, redis]}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud

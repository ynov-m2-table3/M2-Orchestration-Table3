apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextcloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nextcloud
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60     # % du request CPU (200m) -> scale au-delà de ~120m
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # redescend après 2 min de calme (démo plus rapide)

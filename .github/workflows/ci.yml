name: CI/CD

on:
  push:
    branches: [Mathias-Nextcloud]
  workflow_dispatch:

env:
  HOST: ynov-orchestration-table3.duckdns.org
  APP_DIR: /home/deploy/M2-Orchestration-Table3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build de l'image
        run: docker build -t nextcloud-proxy:${{ github.sha }} ./proxy

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: nextcloud-proxy:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rendu kustomize
        run: kubectl kustomize k8s/ > rendered.yaml

      - name: Validation des schémas (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml k8s/tests/load-generator.yaml

      - name: Manifests rendus (artefact)
        uses: actions/upload-artifact@v4  # TODO : épingler sur un SHA comme les autres actions
        with:
          name: k8s-rendered
          path: rendered.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: [build, k8s-manifests]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_MATHIAS }}" > ~/.ssh/id_ed25519
          echo "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Docker installé
        run: ssh deploy@$HOST "docker --version && docker compose version"

      - name: Déploiement
        run: ssh deploy@$HOST "$APP_DIR/deploy.sh"

      - name: Healthchecks
        run: |
          ssh deploy@$HOST "docker compose -f $APP_DIR/compose.yaml ps"
          curl -fsS https://$HOST/status.php

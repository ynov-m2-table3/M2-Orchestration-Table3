name: CI/CD k3s

on:
  push:
    branches: [Mathias-k3s]
  workflow_dispatch:

env:
  HOST: ynov-table3-k3s.duckdns.org   # k3s-1 : le site, et là où on lance deploy.sh
  # les nœuds du cluster, k3s-1 en premier (c'est lui qui crée le cluster) :
  # k3s-1 (Norvège), k3s-2 (Suède), k3s-3 (Pologne), DockerV2 (Norvège, worker)
  NODES: ynov-table3-k3s.duckdns.org 4.223.153.34 74.248.132.169 ynov-orchestration-table3.duckdns.org 20.215.56.199

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["nextcloud:33-apache", "mariadb:11.4", "redis:7-alpine"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan Trivy de l'image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # mauvaises pratiques dans les YAML (root, pas de limites...) : rapport, non bloquant
      - name: Scan Trivy des manifests
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: k8s
          severity: CRITICAL,HIGH
          exit-code: "0"

  deploy:
    runs-on: ubuntu-latest
    needs: [scan, manifests]
    timeout-minutes: 30
    concurrency: deploy-k3s   # jamais deux déploiements en même temps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_MATHIAS }}" > ~/.ssh/id_ed25519
          echo "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Installation de k3s sur chaque nœud
        run: |
          for node in $NODES; do
            echo "== $node"
            rsync -a --delete k8s/ deploy@$node:k8s/
            if [ "$node" != "$HOST" ]; then
              # jeton pour rejoindre le cluster : lu sur k3s-1, écrit sur le nœud, jamais affiché
              ssh deploy@$HOST "sudo cat /var/lib/rancher/k3s/server/token" \
                | ssh deploy@$node "sudo sh -c 'mkdir -p /etc/rancher/k3s; umask 077; cat > /etc/rancher/k3s/token'"
            fi
            ssh deploy@$node "sh k8s/bootstrap.sh"
          done

      - name: Déploiement
        run: ssh deploy@$HOST "sh k8s/deploy.sh"

      - name: Healthchecks
        run: |
          ssh deploy@$HOST "kubectl get nodes && kubectl get pods -A"
          # le certificat peut mettre 1 à 2 min à arriver au premier déploiement
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors https://nextcloud.$HOST/status.php
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -o /dev/null https://grafana.$HOST/api/health
